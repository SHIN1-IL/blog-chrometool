<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>오토블로그 AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      padding: 12px;
      margin: 0;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #1e293b;
      border-bottom: 2px solid #03c75a;
      padding-bottom: 6px;
    }
    .license-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .status-inactive { background: #fee2e2; color: #dc2626; }
    .status-active { background: #dcfce7; color: #15803d; }
    .status-warning { background: #fef3c7; color: #b45309; }
    .usage-card {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      display: none;
    }
    .usage-card.visible { display: block; }
    .usage-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 0;
      color: #475569;
    }
    .usage-row strong { color: #1e293b; }
    .bank-info {
      font-size: 12px;
      color: #475569;
      background: #fff;
      border: 1px dashed #cbd5e1;
      padding: 6px;
      border-radius: 4px;
      margin-top: 6px;
      line-height: 1.4;
      display: none;
    }
    .bank-info.visible { display: block; }
    .bank-toggle {
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      background: #fff;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .license-row {
      display: flex;
      gap: 4px;
    }
    .license-row input { flex: 1; }
    .license-row button {
      width: 70px;
      margin-top: 0;
      padding: 6px;
    }
    .form-group { margin-bottom: 10px; }
    label { font-weight: 600; display: block; margin-bottom: 4px; }
    input[type="text"], select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 13px;
    }
    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .checkbox-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .checkbox-group .full {
      grid-column: 1 / -1;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #03c75a;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      font-size: 13px;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    button.secondary { background: #475569; }
    textarea.result-box {
      height: 160px;
      resize: vertical;
      margin-top: 6px;
    }
    textarea.result-box.short { height: 110px; }
    .tab-container {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      border-bottom: 2px solid #cbd5e1;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 2px;
      background: #f1f5f9;
      color: #64748b;
      border: none;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      margin-top: 0;
    }
    .tab-btn.active { background: #03c75a; color: #fff; }
    .tab-content { display: none; padding-top: 8px; }
    .tab-content.active { display: block; }
    .hint-line { font-size: 11px; color: #64748b; margin: 6px 0; }
    #blogTitle, #blogTags, #placeKeywords { margin-bottom: 6px; }
    .error-msg {
      color: #dc2626;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    .result-section {
      margin-top: 14px;
      display: none;
    }
    .result-section.visible { display: block; }
    .model-tag {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2>🛠️ 오토블로그 3분 현장일기</h2>

  <div class="license-card">
    <div id="licenseBadge" class="status-badge status-inactive">라이선스 미등록</div>
    <div id="usageCard" class="usage-card">
      <div class="usage-row"><span>플랜</span><strong id="usagePlan">—</strong></div>
      <div class="usage-row"><span>구독 남은 기간</span><strong id="usageDays">—</strong></div>
      <div class="usage-row"><span>오늘 남은 건수</span><strong id="usageDaily">—</strong></div>
      <div class="usage-row"><span>이번 달 남은 건수</span><strong id="usageMonthly">—</strong></div>
    </div>
    <div class="license-row">
      <input type="text" id="licenseKeyInput" placeholder="라이선스 키 입력" value="">
      <button id="verifyKeyBtn">등록</button>
    </div>
    <div id="licenseError" class="error-msg"></div>
    <button type="button" id="bankToggle" class="bank-toggle">구독 안내</button>
    <div class="bank-info" id="bankNotice"></div>
  </div>

  <div class="form-group">
    <label for="bizType">업체 종류 *</label>
    <select id="bizType">
      <option value="plumbing">1. 설비업체</option>
      <option value="cleaning">2. 청소업체</option>
      <option value="custom">3. 자가입력</option>
    </select>
  </div>

  <div class="form-group">
    <label for="companyName">업체이름</label>
    <input type="text" id="companyName" placeholder="예: ○○설비 / ○○클리닝">
  </div>

  <div class="form-group">
    <label for="orderDetail">주문내용</label>
    <input type="text" id="orderDetail" placeholder="예: 싱크대 하부 누수 수리">
  </div>

  <div class="form-group">
    <label for="location">현장위치 *</label>
    <input type="text" id="location" placeholder="예: 서초구 반포동 아파트">
  </div>

  <div class="form-group">
    <label for="customerImpression">고객인상</label>
    <input type="text" id="customerImpression" placeholder="예: 아줌마, 아저씨, 가정주부, 젊은이, 아가씨">
  </div>

  <div class="form-group">
    <label for="weather">오늘날씨</label>
    <select id="weather">
      <option value="">선택 안 함</option>
      <option value="☀️ 맑고 화창함">☀️ 맑고 화창함</option>
      <option value="🌧️ 비가 주룩주룩 옴">🌧️ 비가 주룩주룩 옴</option>
      <option value="❄️ 칼바람 부는 한파">❄️ 칼바람 부는 한파</option>
      <option value="🌫️ 습하고 무더운 날씨">🌫️ 습하고 무더운 날씨</option>
    </select>
  </div>

  <div class="form-group">
    <label for="issue">해결사항 *</label>
    <input type="text" id="issue" placeholder="예: 싱크대 하부장 누수 및 곰팡이 냄새">
  </div>

  <div class="form-group">
    <label>현장고충</label>
    <div class="checkbox-group" id="obstacleChecks"></div>
  </div>

  <div class="form-group">
    <label for="process">해결과정 *</label>
    <input type="text" id="process" placeholder="예: 내시경 확인 후 주름관 교체">
  </div>

  <div class="form-group">
    <label for="equipment">사용장비</label>
    <input type="text" id="equipment" placeholder="예: 배관 내시경, 주름관">
  </div>

  <div class="form-group">
    <label for="customerReaction">고객반응</label>
    <input type="text" id="customerReaction" placeholder="예: 감사 인사, 재방문 약속">
  </div>

  <div class="form-group">
    <label for="feeling">완료기분</label>
    <input type="text" id="feeling" placeholder="예: 감사 인사에 보람을 느낌">
  </div>

  <div class="form-group">
    <label for="extra">기타사항</label>
    <input type="text" id="extra" placeholder="예: 추가로 남길 메모">
  </div>

  <div class="form-group">
    <label for="photoCount">넣을 사진 수</label>
    <select id="photoCount">
      <option value="0">0장 (글만)</option>
      <option value="1">1장</option>
      <option value="2">2장</option>
      <option value="3" selected>3장 (권장)</option>
      <option value="4">4장</option>
      <option value="5">5장</option>
    </select>
  </div>

  <div class="form-group">
    <label for="videoCount">짧은 영상</label>
    <select id="videoCount">
      <option value="0" selected>없음</option>
      <option value="1">1개 (15~30초, 직접 첨부)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="tone">글 스타일 *</label>
    <select id="tone">
      <option value="친절하고 꼼꼼한 전문가형">친절한 전문가형</option>
      <option value="현장감 넘치는 베테랑 일기형">베테랑 일기형</option>
      <option value="원인과 해결 중심 정보전달형">원인-해결 정보전달형</option>
    </select>
  </div>

  <button id="generateBtn" disabled>🚀 오늘 현장 광고 만들기</button>

  <div id="resultSection" class="result-section">
    <div class="tab-container">
      <button type="button" class="tab-btn active" data-tab="tab-blog">🟢 블로그</button>
      <button type="button" class="tab-btn" data-tab="tab-daangn">🥕 당근</button>
      <button type="button" class="tab-btn" data-tab="tab-place">📍 지도</button>
      <button type="button" class="tab-btn" data-tab="tab-kakao">💬 카톡</button>
    </div>
    <div id="tab-blog" class="tab-content active">
      <input type="text" id="blogTitle" placeholder="블로그 제목">
      <textarea id="blogContent" class="result-box" placeholder="블로그 본문"></textarea>
      <input type="text" id="blogTags" placeholder="#태그">
      <p class="hint-line">사진은 본문 마커 자리에 직접 넣으세요. 당근·지도에는 1~2장만 쓰는 것이 좋습니다.</p>
      <button id="injectBtn">📝 네이버 에디터로 보내기</button>
      <button id="copyBlogBtn" class="secondary">📋 블로그 전체 복사</button>
    </div>
    <div id="tab-daangn" class="tab-content">
      <textarea id="daangnText" class="result-box" placeholder="당근 비즈프로필 소식"></textarea>
      <button id="copyDaangnBtn" class="secondary">🥕 당근 문구 복사</button>
    </div>
    <div id="tab-place" class="tab-content">
      <label for="reviewSms">고객 리뷰 요청 문자</label>
      <textarea id="reviewSms" class="result-box short" placeholder="문자"></textarea>
      <button id="copySmsBtn" class="secondary">💬 문자 복사</button>
      <label>플레이스 소식</label>
      <textarea id="placeNews" class="result-box short" placeholder="네이버지도 소식"></textarea>
      <button id="copyPlaceNewsBtn" class="secondary">📍 소식 복사</button>
      <label>플레이스 키워드</label>
      <input type="text" id="placeKeywords" readonly>
      <button id="copyKwBtn" class="secondary">📋 키워드 복사</button>
    </div>
    <div id="tab-kakao" class="tab-content">
      <label>고객 카톡</label>
      <textarea id="kakaoCustomer" class="result-box short" placeholder="시공 직후 고객 카톡"></textarea>
      <button id="copyKakaoCustomerBtn" class="secondary">💬 고객 카톡 복사</button>
      <label>채널/단골 소식</label>
      <textarea id="kakaoChannel" class="result-box short" placeholder="카톡 채널 소식"></textarea>
      <button id="copyKakaoChannelBtn" class="secondary">📢 채널 소식 복사</button>
    </div>
    <div id="modelTag" class="model-tag"></div>
  </div>

  <script src="config.js?v=6"></script>
  <script src="business.js?v=6"></script>
  <script src="sidepanel.js?v=6"></script>
</body>
</html>
