<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03c75a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>오토블로그 AI — 사장님 현장 일기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1>오토블로그 3분 현장일기</h1>
    <p class="sub">핸드폰·태블릿·PC 어디서나 · 생성 후 네이버에 붙여넣기</p>
  </header>

  <section class="card" id="licenseCard">
    <div id="licenseBadge" class="badge inactive">라이선스 미등록</div>
    <div id="usageCard" class="usage-card" hidden>
      <div class="usage-row"><span>플랜</span><strong id="usagePlan">—</strong></div>
      <div class="usage-row"><span>구독 남은 기간</span><strong id="usageDays">—</strong></div>
      <div class="usage-row"><span>오늘 남은 건수</span><strong id="usageDaily">—</strong></div>
      <div class="usage-row"><span>이번 달 남은 건수</span><strong id="usageMonthly">—</strong></div>
    </div>
    <div class="row">
      <input type="text" id="licenseKey" placeholder="라이선스 키" autocomplete="off" />
      <button type="button" id="verifyBtn" class="btn-sm">등록</button>
    </div>
    <p id="licenseError" class="error" hidden></p>
    <button type="button" id="bankToggle" class="btn-ghost">구독 안내</button>
    <div id="bankNotice" class="bank" hidden></div>
  </section>

  <form id="genForm" class="card">
    <p class="hint" id="voiceHint">🎤 버튼을 누르고 말한 뒤, 끝나면 다시 눌러 중지하세요. PC 크롬은 주소창에서 마이크를 허용해야 합니다. 아이폰은 타이핑을 이용해 주세요.</p>

    <label>
      1. 업체 종류 *
      <select id="bizType" required>
        <option value="plumbing">설비업체</option>
        <option value="cleaning">청소업체</option>
        <option value="custom">자가입력</option>
      </select>
    </label>

    <label>
      2. 업체이름
      <span class="voice-row">
        <input type="text" id="companyName" placeholder="예: ○○설비 / ○○클리닝" />
        <button type="button" class="mic-btn" data-for="companyName" title="말로 입력">🎤</button>
      </span>
    </label>

    <label>
      3. 현장위치 *
      <span class="voice-row">
        <input type="text" id="location" required placeholder="예: 서초구 반포동 아파트" />
        <button type="button" class="mic-btn" data-for="location" title="말로 입력">🎤</button>
      </span>
    </label>

    <label>
      4. 고객인상
      <span class="voice-row">
        <input type="text" id="customerImpression" placeholder="예: 아줌마, 아저씨, 가정주부, 젊은이, 아가씨" />
        <button type="button" class="mic-btn" data-for="customerImpression" title="말로 입력">🎤</button>
      </span>
    </label>

    <label>
      5. 오늘날씨
      <select id="weather">
        <option value="">선택 안 함</option>
        <option value="☀️ 맑고 화창함">☀️ 맑고 화창함</option>
        <option value="🌧️ 비가 주룩주룩 옴">🌧️ 비가 주룩주룩 옴</option>
        <option value="❄️ 칼바람 부는 한파">❄️ 칼바람 부는 한파</option>
        <option value="🌫️ 습하고 무더운 날씨">🌫️ 습하고 무더운 날씨</option>
      </select>
    </label>

    <label>
      6. 해결사항 *
      <span class="voice-row">
        <input type="text" id="issue" required placeholder="예: 싱크대 하부장 누수 및 곰팡이 냄새" />
        <button type="button" class="mic-btn" data-for="issue" title="말로 입력">🎤</button>
      </span>
    </label>

    <fieldset>
      <legend>7. 현장고충</legend>
      <div class="checks" id="obstacleChecks"></div>
      <span class="voice-row">
        <input type="text" id="obstacleOther" placeholder="기타 고충 (직접 입력)" />
        <button type="button" class="mic-btn" data-for="obstacleOther" title="말로 입력">🎤</button>
      </span>
    </fieldset>

    <label>
      8. 해결과정 *
      <span class="voice-row">
        <input type="text" id="process" required placeholder="예: 내시경 확인 후 주름관 교체 및 방수 실링" />
        <button type="button" class="mic-btn" data-for="process" title="말로 입력">🎤</button>
      </span>
    </label>

    <label>
      9. 사용장비
      <span class="voice-row">
        <input type="text" id="equipment" placeholder="예: 배관 내시경, 주름관" />
        <button type="button" class="mic-btn" data-for="equipment" title="말로 입력">🎤</button>
      </span>
    </label>

    <label>
      10. 고객반응
      <span class="voice-row">
        <input type="text" id="customerReaction" placeholder="예: 감사 인사, 재방문 약속" />
        <button type="button" class="mic-btn" data-for="customerReaction" title="말로 입력">🎤</button>
      </span>
    </label>

    <label>
      11. 완료기분
      <span class="voice-row">
        <input type="text" id="feeling" placeholder="예: 감사 인사에 보람을 느낌" />
        <button type="button" class="mic-btn" data-for="feeling" title="말로 입력">🎤</button>
      </span>
    </label>

    <label>
      12. 글에 더 넣을 말
      <span class="voice-row">
        <input type="text" id="extra" placeholder="예: 추가로 남길 메모" />
        <button type="button" class="mic-btn" data-for="extra" title="말로 입력">🎤</button>
      </span>
    </label>

    <label>
      13. 넣을 사진 수
      <select id="photoCount">
        <option value="0">0장 (글만)</option>
        <option value="1">1장</option>
        <option value="2">2장</option>
        <option value="3" selected>3장 (권장)</option>
        <option value="4">4장</option>
        <option value="5">5장</option>
        <option value="6">6장</option>
        <option value="7">7장</option>
        <option value="8">8장</option>
        <option value="9">9장</option>
        <option value="10">10장</option>
      </select>
    </label>

    <label>
      14. 짧은 영상
      <select id="videoCount">
        <option value="0" selected>없음</option>
        <option value="1">1개 (15~30초, 각 앱에서 직접 첨부)</option>
      </select>
    </label>

    <label>
      15. 글 스타일 *
      <select id="tone" required>
        <option value="친절하고 꼼꼼한 전문가형">친절한 전문가형</option>
        <option value="현장감 넘치는 베테랑 일기형">베테랑 일기형</option>
        <option value="원인과 해결 중심 정보전달형">원인-해결 정보전달형</option>
      </select>
    </label>

    <button type="submit" id="generateBtn" class="btn-primary" disabled>오늘 현장 광고 만들기</button>
    <p id="genError" class="error" hidden></p>
    <p class="hint">※ 무료 서버는 첫 연결 시 30~60초 걸릴 수 있습니다.</p>
  </form>

  <section id="resultSection" class="card result" hidden>
    <div class="tab-container">
      <button type="button" class="tab-btn active" data-tab="tab-blog">블로그</button>
      <button type="button" class="tab-btn" data-tab="tab-daangn">당근</button>
      <button type="button" class="tab-btn" data-tab="tab-place">지도</button>
      <button type="button" class="tab-btn" data-tab="tab-kakao">카톡</button>
    </div>
    <div id="tab-blog" class="tab-content active">
      <input type="text" id="blogTitle" placeholder="제목" />
      <textarea id="blogContent" rows="10"></textarea>
      <input type="text" id="blogTags" placeholder="#태그" />
      <p class="hint">사진·영상은 본문 마커 자리에 네이버 앱에서 직접 넣으세요.</p>
      <button type="button" id="copyBlogBtn" class="btn-primary">블로그 전체 복사</button>
    </div>
    <div id="tab-daangn" class="tab-content">
      <textarea id="daangnText" rows="8"></textarea>
      <button type="button" id="copyDaangnBtn" class="btn-primary">당근 문구 복사</button>
    </div>
    <div id="tab-place" class="tab-content">
      <label for="reviewSms">리뷰 요청 문자</label>
      <textarea id="reviewSms" rows="5"></textarea>
      <button type="button" id="copySmsBtn" class="btn-primary">문자 복사</button>
      <label>플레이스 소식</label>
      <textarea id="placeNews" rows="5"></textarea>
      <button type="button" id="copyPlaceNewsBtn" class="btn-primary">소식 복사</button>
      <label>키워드</label>
      <input type="text" id="placeKeywords" readonly />
      <button type="button" id="copyKwBtn" class="btn-primary">키워드 복사</button>
    </div>
    <div id="tab-kakao" class="tab-content">
      <label>고객 카톡</label>
      <textarea id="kakaoCustomer" rows="5"></textarea>
      <button type="button" id="copyKakaoCustomerBtn" class="btn-primary">고객 카톡 복사</button>
      <label>채널/단골 소식</label>
      <textarea id="kakaoChannel" rows="5"></textarea>
      <button type="button" id="copyKakaoChannelBtn" class="btn-primary">채널 소식 복사</button>
    </div>
    <p id="modelTag" class="model"></p>
    <p id="copyMsg" class="ok" hidden></p>
  </section>

  <footer class="footer">
    <p>PC 크롬 확장도 사용 가능합니다. 관리자에게 zip을 요청하세요.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
