<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>오토블로그 운영 콘솔</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>오토블로그 운영 콘솔</h1>
  <p class="sub">관리자 전용 · 검색에 올리지 마세요</p>

  <section class="card" id="loginCard">
    <form id="loginForm">
      <label for="token">ADMIN_TOKEN</label>
      <div class="row">
        <input type="password" id="token" name="token" autocomplete="current-password" placeholder="Render Environment의 ADMIN_TOKEN" />
        <button type="submit" id="loginBtn">입장</button>
      </div>
    </form>
    <p id="loginErr" class="err" hidden></p>
  </section>

  <div id="desk" hidden>
    <section class="card">
      <h2>빠른 발급</h2>
      <div class="issue-cols">
        <div class="col col-blog">
          <h3>현장블로그 3분</h3>
          <button type="button" data-issue="blog-30">1개월 · 12,900</button>
          <button type="button" data-issue="blog-180">6개월 · 64,500</button>
          <button type="button" data-issue="blog-365">1년 · 129,000</button>
          <button type="button" data-issue="trial-blog">체험 1건</button>
          <button type="button" data-issue="family-blog">지인 30일</button>
        </div>
        <div class="col col-allin">
          <h3>동네광고 올인원</h3>
          <button type="button" class="btn-allin" data-issue="allin-30">1개월 · 24,900</button>
          <button type="button" class="btn-allin" data-issue="allin-180">6개월 · 124,500</button>
          <button type="button" class="btn-allin" data-issue="allin-365">1년 · 249,000</button>
          <button type="button" class="btn-allin" data-issue="trial-allin">체험 1건</button>
          <button type="button" class="btn-allin" data-issue="family-allin">지인 30일</button>
        </div>
      </div>
      <label>메모 (업체명·전화) — 발급 시 같이 저장</label>
      <input type="text" id="note" placeholder="예: ○○설비 010-..." />
      <p id="issueMsg" class="ok" hidden></p>
      <label>고객 안내 카톡 (복사)</label>
      <textarea id="customerMsg" rows="10" readonly></textarea>
      <button type="button" id="copyMsgBtn" class="secondary">안내문 복사</button>
    </section>

    <section class="card">
      <h2>라이선스</h2>
      <button type="button" id="refreshBtn" class="secondary">새로고침</button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>키</th>
              <th>플랜</th>
              <th>만료</th>
              <th>상태</th>
              <th>오늘</th>
              <th>메모</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="app.js?v=20260915mail"></script>
</body>
</html>
