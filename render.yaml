# Render 배포용 (선택)
# https://render.com 에서 New Web Service 생성 시 참고

services:
  - type: web
    name: autoblog-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/autoblog.db
    disk:
      name: autoblog-data
      mountPath: /var/data
      sizeGB: 1
