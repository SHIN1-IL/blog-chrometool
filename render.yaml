# Render 배포용 (선택)
# https://render.com 에서 New Web Service 생성 시 참고

services:
  - type: web
    name: autoblog-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ENABLED
        value: "true"
      - key: GEMINI_TIMEOUT
        value: "90"
      - key: ADMIN_TOKEN
        sync: false
      # Free plan: no persistent disk. Use local file (resets on redeploy/sleep).
      # Paid + Disk: set to /var/data/autoblog.db and attach disk at /var/data
      - key: DATABASE_PATH
        value: ./autoblog.db
      - key: LICENSE_VAULT_PATH
        value: /var/data/licenses.vault.json
    # Paid plan: uncomment disk so SQLite survives sleep/redeploy.
    # Free plan: license keys are restored from backend/data/licenses.vault.json
    # disk:
    #   name: autoblog-data
    #   mountPath: /var/data
    #   sizeGB: 1
